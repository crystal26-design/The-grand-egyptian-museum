<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>大埃及博物馆·智能语音导览</title>
<style>
    :root {
        --gold: #d4af37;
        --dark: #14100b;
        --dark2: #1e1810;
        --sand: #f4eae1;
        --line: rgba(212, 175, 55, 0.28);
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    html, body {
        margin: 0; padding: 0; height: 100%; overflow: hidden;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
        background: var(--dark); color: #fff;
    }
    body { display: flex; flex-direction: column; }

    /* ================= 顶部标题 ================= */
    header {
        flex: 0 0 auto;
        background: rgba(0, 0, 0, 0.9);
        text-align: center;
        padding: 10px 0 8px;
        border-bottom: 2px solid var(--gold);
    }
    header .title {
        font-size: 1rem; font-weight: bold; color: var(--gold);
        letter-spacing: 2px;
    }
    header .sub {
        font-size: 0.68rem; color: rgba(244, 234, 225, 0.55);
        letter-spacing: 1px; margin-top: 3px;
    }

    /* ================= Tab 切换 ================= */
    #tab-bar {
        flex: 0 0 auto;
        display: flex;
        background: var(--dark2);
        border-bottom: 1px solid var(--line);
    }
    .tab-btn {
        flex: 1;
        padding: 12px 0;
        text-align: center;
        font-size: 0.9rem;
        color: rgba(244, 234, 225, 0.6);
        background: transparent;
        border: none;
        border-bottom: 2px solid transparent;
        cursor: pointer;
        transition: all 0.2s;
        font-family: inherit;
    }
    .tab-btn.active {
        color: var(--gold);
        border-bottom-color: var(--gold);
        font-weight: bold;
        background: rgba(212, 175, 55, 0.06);
    }

    /* ================= 内容区 ================= */
    #main {
        flex: 1 1 auto;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
        padding: 12px 12px 90px;
    }
    .view { display: none; }
    .view.active { display: block; }

    /* ---------- 区域卡片 ---------- */
    .zone-card {
        border: 1px solid var(--line);
        border-radius: 12px;
        background: linear-gradient(180deg, rgba(212,175,55,0.07), rgba(212,175,55,0.02));
        margin-bottom: 12px;
        overflow: hidden;
    }
    .zone-head {
        display: flex; align-items: center; gap: 10px;
        padding: 13px 14px;
        cursor: pointer;
        user-select: none;
    }
    /* 区域缩略图 */
    .zone-thumb {
        flex: 0 0 auto;
        width: 44px; height: 44px;
        border-radius: 8px;
        border: 1px solid var(--line);
        background: #2a2218 center/cover no-repeat;
        display: flex; justify-content: center; align-items: center;
        font-size: 1.05rem; color: rgba(212,175,55,0.5);
        overflow: hidden;
    }
    .zone-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .zone-name {
        flex: 1;
        font-size: 0.95rem; font-weight: bold; color: var(--sand);
        line-height: 1.3;
        min-width: 0;
    }
    .zone-name .en {
        display: block;
        font-size: 0.62rem;
        font-weight: normal;
        color: rgba(244,234,225,0.4);
        letter-spacing: 1px;
        margin-top: 2px;
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .zone-count {
        flex: 0 0 auto;
        font-size: 0.7rem; color: var(--gold);
        border: 1px solid var(--line);
        border-radius: 10px; padding: 2px 7px;
        margin-right: 4px;
    }
    .zone-arrow {
        flex: 0 0 auto;
        color: var(--gold); font-size: 0.75rem;
        transition: transform 0.25s;
    }
    .zone-card.open .zone-arrow { transform: rotate(90deg); }

    .zone-play {
        flex: 0 0 auto;
        background: transparent;
        border: 1px solid var(--gold);
        color: var(--gold);
        border-radius: 14px;
        font-size: 0.7rem;
        padding: 4px 10px;
        cursor: pointer;
        font-family: inherit;
        white-space: nowrap;
    }
    .zone-play:active { background: rgba(212,175,55,0.18); }

    .zone-items {
        display: none;
        border-top: 1px solid var(--line);
        background: rgba(0,0,0,0.25);
    }
    .zone-card.open .zone-items { display: block; }

    .item-row {
        display: flex; align-items: center; gap: 10px;
        padding: 11px 14px;
        border-bottom: 1px solid rgba(212,175,55,0.1);
        cursor: pointer;
    }
    .item-row:last-child { border-bottom: none; }
    .item-row:active { background: rgba(212,175,55,0.1); }
    .item-no {
        flex: 0 0 auto;
        width: 30px;
        font-size: 0.72rem; color: var(--gold); font-weight: bold;
        text-align: center;
    }
    .item-thumb {
        flex: 0 0 auto;
        width: 42px; height: 42px;
        border-radius: 6px;
        border: 1px solid var(--line);
        background: #2a2218 center/cover no-repeat;
        display: flex; justify-content: center; align-items: center;
        font-size: 1rem; color: rgba(212,175,55,0.5);
        overflow: hidden;
    }
    .item-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .item-text { flex: 1; min-width: 0; }
    .item-name {
        font-size: 0.86rem; color: var(--sand);
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .item-sub {
        font-size: 0.7rem; color: rgba(244,234,225,0.45);
        margin-top: 2px;
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .item-audio {
        flex: 0 0 auto;
        width: 26px; height: 26px; border-radius: 50%;
        border: 1px solid var(--gold);
        display: flex; justify-content: center; align-items: center;
        font-size: 0.7rem; color: var(--gold);
    }

    /* ---------- 地图视图（3 张图画廊） ---------- */
    #map-view { text-align: center; }
    .map-tip {
        font-size: 0.75rem; color: rgba(244,234,225,0.5);
        margin: 2px 0 10px;
    }

    /* 横向滑动画廊 */
    .map-gallery {
        display: flex;
        gap: 12px;
        overflow-x: auto;
        scroll-snap-type: x mandatory;
        -webkit-overflow-scrolling: touch;
        padding-bottom: 6px;
        scrollbar-width: none;
    }
    .map-gallery::-webkit-scrollbar { display: none; }

    .map-slide {
        flex: 0 0 100%;
        scroll-snap-align: center;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: #2a221b;
        overflow: hidden;
        position: relative;
    }
    .map-slide img {
        width: 100%;
        height: auto;
        display: block;
        cursor: zoom-in;
    }
    /* 地图标题角标 */
    .map-slide .cap {
        position: absolute;
        left: 0; right: 0; bottom: 0;
        padding: 22px 14px 10px;
        font-size: 0.78rem;
        color: var(--sand);
        text-align: left;
        background: linear-gradient(180deg, transparent, rgba(0,0,0,0.78));
        pointer-events: none;
    }
    /* 无图占位 */
    .map-placeholder {
        width: 100%; aspect-ratio: 4 / 3;
        background:
            repeating-linear-gradient(45deg, rgba(212,175,55,0.06) 0 12px, transparent 12px 24px),
            #2a221b;
        display: flex; flex-direction: column;
        justify-content: center; align-items: center;
        gap: 6px;
        color: rgba(212,175,55,0.65);
        font-size: 0.8rem;
    }
    .map-placeholder .big { font-size: 1.8rem; }

    /* 分页圆点 */
    .map-dots {
        display: flex; justify-content: center; align-items: center;
        gap: 8px;
        margin-top: 12px;
    }
    .map-dot {
        width: 7px; height: 7px;
        border-radius: 50%;
        background: rgba(212,175,55,0.28);
        border: none;
        padding: 0;
        cursor: pointer;
        transition: all 0.25s;
    }
    .map-dot.active {
        width: 20px;
        border-radius: 4px;
        background: var(--gold);
    }

    /* 地图放大查看层 */
    #map-zoom {
        position: fixed; inset: 0;
        background: rgba(0,0,0,0.94);
        z-index: 9700;
        display: flex; justify-content: center; align-items: center;
        opacity: 0; visibility: hidden;
        transition: opacity 0.25s, visibility 0.25s;
    }
    #map-zoom.show { opacity: 1; visibility: visible; }
    #map-zoom img {
        max-width: 100vw;
        max-height: 100vh;
        object-fit: contain;
    }
    #map-zoom .zoom-close {
        position: absolute; top: 14px; right: 14px;
        width: 36px; height: 36px; border-radius: 50%;
        border: 1px solid var(--gold); background: rgba(0,0,0,0.6);
        color: var(--gold); font-size: 18px; line-height: 1;
        display: flex; justify-content: center; align-items: center;
        cursor: pointer;
    }

    /* ================= 讲解弹层（区域 / 展品共用） ================= */
    #detail-modal {
        position: fixed; inset: 0;
        background: rgba(0,0,0,0.9);
        z-index: 9000;
        display: flex; justify-content: center; align-items: center;
        opacity: 0; visibility: hidden;
        transition: opacity 0.25s, visibility 0.25s;
        padding: 16px;
    }
    #detail-modal.show { opacity: 1; visibility: visible; }

    .detail-card {
        width: 100%;
        max-width: 460px;
        max-height: 88vh;
        background: var(--dark2);
        border: 1px solid var(--gold);
        border-radius: 14px;
        display: flex; flex-direction: column;
        overflow: hidden;
        transform: scale(0.94);
        transition: transform 0.25s;
        box-shadow: 0 0 50px rgba(212,175,55,0.35);
    }
    #detail-modal.show .detail-card { transform: scale(1); }

    .detail-head {
        flex: 0 0 auto;
        display: flex; align-items: center; gap: 10px;
        padding: 12px 14px;
        border-bottom: 1px solid var(--line);
        background: rgba(0,0,0,0.35);
    }
    .detail-badge {
        flex: 0 0 auto;
        font-size: 0.66rem;
        color: var(--gold);
        border: 1px solid var(--gold);
        border-radius: 10px;
        padding: 2px 8px;
    }
    .detail-title {
        flex: 1;
        font-size: 0.95rem; font-weight: bold; color: var(--sand);
        line-height: 1.3;
    }
    .detail-close {
        flex: 0 0 auto;
        width: 28px; height: 28px;
        border-radius: 50%;
        border: 1px solid var(--gold);
        background: transparent;
        color: var(--gold);
        font-size: 16px; line-height: 1;
        cursor: pointer;
        display: flex; justify-content: center; align-items: center;
    }

    .detail-body {
        flex: 1 1 auto;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
    }
    .detail-photo {
        width: 100%;
        aspect-ratio: 4 / 3;
        background: #0e0b07;
        display: flex; justify-content: center; align-items: center;
        overflow: hidden;
        border-bottom: 1px solid var(--line);
        position: relative;
    }
    .detail-photo img {
        width: 100%; height: 100%; object-fit: cover; display: block;
        cursor: zoom-in;
    }
    .photo-placeholder {
        position: absolute; inset: 0;
        display: flex; flex-direction: column;
        justify-content: center; align-items: center; gap: 6px;
        color: rgba(212,175,55,0.55);
        font-size: 0.78rem;
        background:
            repeating-linear-gradient(45deg, rgba(212,175,55,0.05) 0 14px, transparent 14px 28px);
        text-align: center;
        padding: 0 20px;
    }
    .photo-placeholder .big { font-size: 2.2rem; }

    .detail-desc {
        padding: 13px 15px;
        font-size: 0.84rem;
        line-height: 1.65;
        color: rgba(244,234,225,0.8);
        border-bottom: 1px solid var(--line);
    }

    .audio-bar {
        padding: 12px 14px;
        display: flex; align-items: center; gap: 12px;
        background: rgba(212,175,55,0.06);
    }
    .play-btn {
        flex: 0 0 auto;
        width: 42px; height: 42px;
        border-radius: 50%;
        background: var(--gold);
        border: none;
        color: var(--dark);
        font-size: 1rem;
        font-weight: bold;
        cursor: pointer;
        display: flex; justify-content: center; align-items: center;
    }
    .play-btn:disabled { background: #555; color: #888; cursor: not-allowed; }

    .audio-meta { flex: 1; min-width: 0; }
    .audio-label {
        font-size: 0.75rem; color: var(--gold);
        display: flex; justify-content: space-between;
        margin-bottom: 5px;
    }
    .audio-track {
        height: 4px;
        background: rgba(255,255,255,0.15);
        border-radius: 2px;
        overflow: hidden;
        cursor: pointer;
    }
    .audio-progress {
        height: 100%; width: 0%;
        background: var(--gold);
        border-radius: 2px;
        transition: width 0.15s linear;
    }

    /* ================= AI 悬浮球 ================= */
    #ai-fab {
        position: fixed;
        right: 16px; bottom: 20px;
        width: 54px; height: 54px;
        border-radius: 50%;
        background: radial-gradient(circle at 30% 30%, #f0d67a, var(--gold) 65%);
        border: 2px solid #fff;
        box-shadow: 0 4px 20px rgba(212,175,55,0.55);
        display: flex; flex-direction: column;
        justify-content: center; align-items: center;
        cursor: pointer;
        z-index: 9500;
        color: var(--dark);
        transition: transform 0.2s;
    }
    #ai-fab:active { transform: scale(0.92); }
    #ai-fab .ico { font-size: 1.35rem; line-height: 1; }
    #ai-fab .txt { font-size: 0.55rem; font-weight: bold; letter-spacing: 1px; margin-top: 1px; }

    #ai-panel {
        position: fixed;
        right: 12px; bottom: 12px;
        width: calc(100% - 24px);
        max-width: 400px;
        height: min(70vh, 520px);
        background: var(--dark2);
        border: 1px solid var(--gold);
        border-radius: 14px;
        box-shadow: 0 10px 50px rgba(0,0,0,0.75);
        z-index: 9600;
        display: flex; flex-direction: column;
        overflow: hidden;
        transform: translateY(16px) scale(0.96);
        opacity: 0; visibility: hidden;
        transition: all 0.25s ease;
    }
    #ai-panel.show { transform: none; opacity: 1; visibility: visible; }

    .ai-head {
        flex: 0 0 auto;
        display: flex; align-items: center; justify-content: space-between;
        padding: 11px 14px;
        background: rgba(0,0,0,0.4);
        border-bottom: 1px solid var(--line);
        font-size: 0.9rem; font-weight: bold; color: var(--gold);
    }
    .ai-head .close {
        width: 26px; height: 26px; border-radius: 50%;
        border: 1px solid var(--gold); background: transparent;
        color: var(--gold); font-size: 15px; line-height: 1;
        cursor: pointer;
        display: flex; justify-content: center; align-items: center;
    }
    .ai-context {
        flex: 0 0 auto;
        font-size: 0.68rem;
        color: rgba(244,234,225,0.5);
        padding: 6px 14px;
        border-bottom: 1px solid rgba(212,175,55,0.12);
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .ai-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 12px 14px;
        font-size: 0.85rem;
        line-height: 1.6;
        color: #ddd;
        -webkit-overflow-scrolling: touch;
    }
    .ai-body .msg { margin-bottom: 10px; }
    .ai-body .msg.user { text-align: right; }
    .ai-body .msg.user span {
        display: inline-block;
        background: rgba(212,175,55,0.18);
        border: 1px solid var(--line);
        border-radius: 10px 10px 2px 10px;
        padding: 7px 11px;
        max-width: 85%;
        color: var(--sand);
        text-align: left;
    }
    .ai-body .msg.ai span {
        display: inline-block;
        background: rgba(0,0,0,0.4);
        border: 1px solid rgba(212,175,55,0.18);
        border-radius: 10px 10px 10px 2px;
        padding: 7px 11px;
        max-width: 92%;
    }
    .ai-input-wrap {
        flex: 0 0 auto;
        display: flex; gap: 8px;
        padding: 10px 12px;
        border-top: 1px solid var(--line);
        background: rgba(0,0,0,0.3);
    }
    .ai-input-wrap input {
        flex: 1;
        background: #2b231a;
        border: 1px solid var(--gold);
        border-radius: 20px;
        padding: 8px 14px;
        color: #fff; outline: none;
        font-size: 0.85rem;
        font-family: inherit;
    }
    .ai-input-wrap button {
        flex: 0 0 auto;
        background: var(--gold); border: none;
        color: var(--dark);
        border-radius: 20px;
        padding: 8px 18px;
        font-weight: bold; font-size: 0.85rem;
        cursor: pointer;
        font-family: inherit;
    }
    .ai-input-wrap button:disabled { background: #555; color: #888; }

    #global-player { display: none; }
</style>
</head>
<body>

<header>
    <div class="title">🏛️ 大埃及博物馆·智能语音导览</div>
    <div class="sub">GRAND EGYPTIAN MUSEUM · AUDIO GUIDE</div>
</header>

<div id="tab-bar">
    <button class="tab-btn active" id="tab-list" onclick="switchTab('list')">展品检索</button>
    <button class="tab-btn" id="tab-map" onclick="switchTab('map')">展馆地图</button>
</div>

<div id="main">

    <!-- ============ 视图一：展品检索（默认） ============ -->
    <div class="view active" id="view-list"></div>

    <!-- ============ 视图二：展馆地图（3 张图画廊） ============ -->
    <div class="view" id="view-map">
        <div id="map-view">
            <div class="map-tip">博物馆平面图 · 左右滑动查看 3 张，点击图片可放大</div>
            <div class="map-gallery" id="map-gallery"></div>
            <div class="map-dots" id="map-dots"></div>
        </div>
    </div>

</div>

<!-- ================= 地图放大查看 ================= -->
<div id="map-zoom" onclick="if(event.target===this) closeMapZoom()">
    <button class="zoom-close" onclick="closeMapZoom()">&times;</button>
    <img id="map-zoom-img" src="" alt="平面图放大">
</div>

<!-- ================= 讲解弹层（区域 / 展品共用） ================= -->
<div id="detail-modal" onclick="if(event.target===this) closeDetail()">
    <div class="detail-card">
        <div class="detail-head">
            <span class="detail-badge" id="detail-badge">区域</span>
            <div class="detail-title" id="detail-title">标题</div>
            <button class="detail-close" onclick="closeDetail()">&times;</button>
        </div>
        <div class="detail-body">
            <div class="detail-photo">
                <img id="detail-img" src="" alt="" style="display:none" onclick="openMapZoom(this.src)">
                <div class="photo-placeholder" id="detail-photo-ph">
                    <div class="big">🖼️</div>
                    <div id="detail-photo-ph-text">图片占位</div>
                </div>
            </div>
            <div class="detail-desc" id="detail-desc">描述占位</div>
            <div class="audio-bar">
                <button class="play-btn" id="play-btn" onclick="toggleAudio()">▶</button>
                <div class="audio-meta">
                    <div class="audio-label">
                        <span>语音讲解</span>
                        <span id="audio-time">00:00 / 00:00</span>
                    </div>
                    <div class="audio-track" onclick="seekAudio(event)">
                        <div class="audio-progress" id="audio-progress"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- ================= AI 悬浮球 ================= -->
<div id="ai-fab" onclick="toggleAiPanel()">
    <div class="ico">🔮</div>
    <div class="txt">AI</div>
</div>

<!-- ================= AI 对话面板 ================= -->
<div id="ai-panel">
    <div class="ai-head">
        <span>🔮 法老密示</span>
        <button class="close" onclick="toggleAiPanel(false)">&times;</button>
    </div>
    <div class="ai-context" id="ai-context">当前浏览：导览首页</div>
    <div class="ai-body" id="ai-body">
        <div class="msg ai"><span>游客，点击任意区域或展品即可聆听讲解。若有历史疑问，尽管在此向我发问……</span></div>
    </div>
    <div class="ai-input-wrap">
        <input type="text" id="user-question" placeholder="向拉美西斯二世提问..."
               onkeypress="handleKeyPress(event)">
        <button onclick="askPharaoh()" id="ask-btn">提问</button>
    </div>
</div>

<audio id="global-player" preload="metadata"></audio>

<script>
/* =========================================================
   一、数据配置区（改名字 / 换图片 / 换音频，只动这里）
   ========================================================= */

/* 6 个区域：每块区域各自一张图 zoneImg */
const ZONES = [
    { id: 'z1', name: '走进大埃及博物馆', en: 'Arrival',           count: 5,
      img: 'images/zone1.jpg', zoneImg: 'images/zone1.jpg', audio: 'audio/zone1.mp3',
      desc: '【区域讲解文案占位】简述大埃及博物馆的建馆背景、地理位置、建筑规模与参观动线。' },
    { id: 'z2', name: '大厅',               en: 'Grand Hall',       count: 6,
      img: 'images/zone2.jpg', zoneImg: 'images/zone2.jpg', audio: 'audio/zone2.mp3',
      desc: '【区域讲解文案占位】介绍大厅的空间设计、标志性展品与整体参观氛围。' },
    { id: 'z3', name: '大阶梯',             en: 'Grand Staircase',  count: 6,
      img: 'images/zone3.jpg', zoneImg: 'images/zone3.jpg', audio: 'audio/zone3.mp3',
      desc: '【区域讲解文案占位】介绍大阶梯的阶梯式布展逻辑、沿途陈列的雕像与视觉轴线。' },

/* =========================================================
   二、渲染逻辑
   ========================================================= */

const viewList = document.getElementById('view-list');
const viewMap  = document.getElementById('view-map');

let currentContext = '导览首页';
let currentDetail  = null;

/* ---- 渲染区域列表 ---- */
function renderList() {
    viewList.innerHTML = ZONES.map((z, zi) => {
        const items = ITEMS.filter(it => it.zone === z.id);

        const rows = items.map(it => `
            <div class="item-row" onclick="openItem(${it.no})">
                <div class="item-no">${it.no}</div>
                <div class="item-thumb" data-thumb="${it.img}">🖼</div>
                <div class="item-text">
                    <div class="item-name">${it.name}</div>
                    <div class="item-sub">${it.sub}</div>
                </div>
                <div class="item-audio">🔊</div>
            </div>
        `).join('');

        return `
        <div class="zone-card" id="zc-${z.id}">
            <div class="zone-head" onclick="toggleZone('${z.id}')">
                <div class="zone-thumb" data-thumb="${z.zoneImg}">🏛</div>
                <div class="zone-name">
                    ${z.name}
                    <span class="en">${z.en}</span>
                </div>
                <div class="zone-count">${items.length} 件</div>
                <button class="zone-play" onclick="event.stopPropagation(); openZone('${z.id}')">▶ 区域讲解</button>
                <div class="zone-arrow">▶</div>
            </div>
            <div class="zone-items">${rows}</div>
        </div>`;
    }).join('');

    // 缩略图懒加载
    document.querySelectorAll('[data-thumb]').forEach(box => {
        const src = box.dataset.thumb;
        if (!src) return;
        const img = new Image();
        img.onload = () => { box.innerHTML = `<img src="${src}" alt="">`; };
        img.src = src;
    });
}

/* ---- 渲染地图画廊（3 张） ---- */
function renderMap() {
    const gallery = document.getElementById('map-gallery');
    const dots    = document.getElementById('map-dots');

    gallery.innerHTML = MAP_IMAGES.map((m, i) => `
        <div class="map-slide" data-idx="${i}">
            <img src="${m.img}" alt="${m.title}"
                 onclick="openMapZoom(this.src)"
                 onerror="this.outerHTML='&lt;div class=\\'map-placeholder\\'&gt;&lt;div class=\\'big\\'&gt;🗺️&lt;/div&gt;&lt;div&gt;${m.title} · 图片占位&lt;/div&gt;&lt;div style=&quot;font-size:0.68rem;opacity:0.7&quot;&gt;${m.img}&lt;/div&gt;&lt;/div&gt;'">
            <div class="cap">${i + 1} / ${MAP_IMAGES.length} · ${m.title}</div>
        </div>
    `).join('');

    dots.innerHTML = MAP_IMAGES.map((m, i) =>
        `<button class="map-dot ${i === 0 ? 'active' : ''}" onclick="scrollToMap(${i})" aria-label="${m.title}"></button>`
    ).join('');

    // 滑动时同步圆点
    gallery.addEventListener('scroll', () => {
        const w = gallery.clientWidth;
        if (!w) return;
        const idx = Math.round(gallery.scrollLeft / (w + 12));
        dots.querySelectorAll('.map-dot').forEach((d, i) => d.classList.toggle('active', i === idx));
    });
}

function scrollToMap(i) {
    const gallery = document.getElementById('map-gallery');
    const slide = gallery.children[i];
    if (!slide) return;
    gallery.scrollTo({ left: slide.offsetLeft - gallery.offsetLeft, behavior: 'smooth' });
}

/* ---- Tab 切换 ---- */
function switchTab(which) {
    document.getElementById('tab-list').classList.toggle('active', which === 'list');
    document.getElementById('tab-map').classList.toggle('active', which === 'map');
    viewList.classList.toggle('active', which === 'list');
    viewMap.classList.toggle('active', which === 'map');
    document.getElementById('main').scrollTop = 0;
    currentContext = which === 'list' ? '展品检索' : '展馆地图';
    updateAiContext();
}

/* ---- 区域展开 / 收起（手风琴） ---- */
function toggleZone(id) {
    const card = document.getElementById('zc-' + id);
    if (!card) return;
    const willOpen = !card.classList.contains('open');
    document.querySelectorAll('.zone-card').forEach(c => c.classList.remove('open'));
    if (willOpen) card.classList.add('open');
}

/* ---- 打开区域讲解 ---- */
function openZone(id) {
    const z = ZONES.find(x => x.id === id);
    if (!z) return;
    currentDetail = { type: 'zone', data: z };
    currentContext = `区域：${z.name}`;
    updateAiContext();

    document.getElementById('detail-badge').innerText = '区域讲解';
    document.getElementById('detail-title').innerText = z.name;
    document.getElementById('detail-desc').innerText = z.desc;
    setDetailPhoto(z.zoneImg, z.name);
    loadAudio(z.audio);
    showDetail();
}

/* ---- 打开展品讲解 ---- */
function openItem(no) {
    const it = ITEMS.find(x => x.no === Number(no));
    if (!it) return;
    const z = ZONES.find(x => x.id === it.zone);
    currentDetail = { type: 'item', data: it };
    currentContext = `展品 ${it.no}：${it.name}` + (z ? `（${z.name}）` : '');
    updateAiContext();

    document.getElementById('detail-badge').innerText = '展品 ' + String(it.no).padStart(2, '0');
    document.getElementById('detail-title').innerText = it.name;
    document.getElementById('detail-desc').innerText = it.desc;
    setDetailPhoto(it.img, it.name);
    loadAudio(it.audio);
    showDetail();
}

/* ---- 详情图片（有图显示，无图占位） ---- */
function setDetailPhoto(src, name) {
    const img = document.getElementById('detail-img');
    const ph  = document.getElementById('detail-photo-ph');
    const phT = document.getElementById('detail-photo-ph-text');
    img.style.display = 'none';
    ph.style.display = 'flex';
    img.onload = () => { img.style.display = 'block'; ph.style.display = 'none'; };
    img.onerror = () => {
        img.style.display = 'none';
        ph.style.display = 'flex';
        phT.innerText = '图片占位 · ' + (src || '未配置');
    };

}

function showDetail() {
    document.getElementById('detail-modal').classList.add('show');

function closeDetail() {

/* =========================================================
   三、音频播放
   ========================================================= */
const player   = document.getElementById('global-player');
const playBtn  = document.getElementById('play-btn');
const progress = document.getElementById('audio-progress');
const timeText = document.getElementById('audio-time');

function loadAudio(src) {
    player.pause();
    playBtn.innerText = '▶';
    progress.style.width = '0%';
    timeText.innerText = '00:00 / 00:00';
    player.src = src || '';
    if (!src) { playBtn.disabled = true; return; }
    playBtn.disabled = false;
}

function toggleAudio() {
    if (!player.src) return;
    if (player.paused) {
        player.play().then(() => { playBtn.innerText = '⏸'; })
                      .catch(() => { playBtn.innerText = '▶'; });
    } else {
        player.pause();
        playBtn.innerText = '▶';
    }
}

player.addEventListener('play',  () => playBtn.innerText = '⏸');
player.addEventListener('pause', () => playBtn.innerText = '▶');
player.addEventListener('ended', () => { playBtn.innerText = '▶'; progress.style.width = '0%'; });

player.addEventListener('timeupdate', () => {
    if (!player.duration) return;
    progress.style.width = (player.currentTime / player.duration * 100) + '%';
    timeText.innerText = fmt(player.currentTime) + ' / ' + fmt(player.duration);
});
player.addEventListener('loadedmetadata', () => {
    timeText.innerText = '00:00 / ' + fmt(player.duration);
});
player.addEventListener('error', () => {
    playBtn.disabled = true;
    timeText.innerText = '音频未找到';
});

function fmt(s) {
    if (!isFinite(s)) return '00:00';
    const m = Math.floor(s / 60);
    const ss = Math.floor(s % 60);
    return String(m).padStart(2, '0') + ':' + String(ss).padStart(2, '0');
}

function seekAudio(e) {
    if (!player.duration) return;
    const rect = e.currentTarget.getBoundingClientRect();
    const ratio = Math.min(Math.max((e.clientX - rect.left) / rect.width, 0), 1);
    player.currentTime = ratio * player.duration;
}


/* =========================================================
   四、AI 悬浮面板
   ========================================================= */
let eventSource = null;
let aiBusy = false;

function toggleAiPanel(force) {
    const panel = document.getElementById('ai-panel');
    const show = typeof force === 'boolean' ? force : !panel.classList.contains('show');
    panel.classList.toggle('show', show);
    if (show) setTimeout(() => document.getElementById('user-question').focus(), 260);
}

function updateAiContext() {
    document.getElementById('ai-context').innerText = '当前浏览：' + currentContext;
}

function handleKeyPress(e) {
    if (e.key === 'Enter') askPharaoh();
}

function appendMsg(role, text) {
    const body = document.getElementById('ai-body');
    const div = document.createElement('div');
    div.className = 'msg ' + role;
    div.innerHTML = '<span>' + text + '</span>';
    body.appendChild(div);
    body.scrollTop = body.scrollHeight;
    return div.querySelector('span');
}

function askPharaoh() {
    if (aiBusy) return;
    const input = document.getElementById('user-question');
    const btn   = document.getElementById('ask-btn');
    const question = input.value.trim();
    if (!question) return;

    if (eventSource) { eventSource.close(); eventSource = null; }

    input.value = '';
    input.disabled = true;
    btn.disabled = true;
    aiBusy = true;

    appendMsg('user', question);
    const aiSpan = appendMsg('ai', '⏳ 法老正拨开三千年的风沙，在泥板上翻阅史料...');

    let fullAnswer = '';
    const ctx = currentContext !== '导览首页' ? `当前游客在：${currentContext}。问题是：` : '';
    const url = `/api/chat?question=${encodeURIComponent(ctx + question)}`;
    eventSource = new EventSource(url);

    eventSource.addEventListener('conversation.message.delta', function (e) {
        try {
            const obj = JSON.parse(e.data);
            if (obj.type === 'answer') {
                const chunk = obj.content || obj.reasoning_content || '';
                if (chunk) {
                    fullAnswer += chunk;
                    aiSpan.innerHTML = fullAnswer;
                    const body = document.getElementById('ai-body');
                    body.scrollTop = body.scrollHeight;
                }
            }
        } catch (err) { /* 忽略解析失败的分片 */ }
    });

    eventSource.addEventListener('conversation.chat.completed', safeClose);
    eventSource.addEventListener('conversation.chat.failed', function () {
        aiSpan.innerHTML = '神殿算力已耗尽，请稍后再向我发问。';
        safeClose();
    });
    eventSource.onerror = function () {
        aiSpan.innerHTML = '法老正在神殿沉睡，恢复网络后再来打扰吧。';
        safeClose();
    };

    function safeClose() {
        if (eventSource) { eventSource.close(); eventSource = null; }
        input.disabled = false;
        btn.disabled = false;
        aiBusy = false;
    }
}

        if (e.key === 'Escape') {
            if (document.getElementById('map-zoom').classList.contains('show')) closeMapZoom();
            else if (document.getElementById('detail-modal').classList.contains('show')) closeDetail();
            else toggleAiPanel(false);
        }
    });

    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('/sw.js')
                .then(() => console.log('离线导览系统准备就绪！'))
                .catch(err => console.log('离线注册失败:', err));
        });
    }
});
</script>

</body>
</html>
