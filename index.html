<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>大埃及博物馆·智能语音导览</title>
<style>
    :root {
        --gold: #d4af37;
        --dark: #14100b;
        --dark2: #1e1810;
        --sand: #f4eae1;
        --line: rgba(212, 175, 55, 0.28);
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    html, body {
        margin: 0; padding: 0; height: 100%; overflow: hidden;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
        background: var(--dark); color: #fff;
    }
    body { display: flex; flex-direction: column; }

    /* ================= 顶部标题 ================= */
    header {
        flex: 0 0 auto;
        background: rgba(0, 0, 0, 0.9);
        text-align: center;
        padding: 10px 0 8px;
        border-bottom: 2px solid var(--gold);
    }
    header .title {
        font-size: 1rem; font-weight: bold; color: var(--gold);
        letter-spacing: 2px;
    }
    header .sub {
        font-size: 0.68rem; color: rgba(244, 234, 225, 0.55);
        letter-spacing: 1px; margin-top: 3px;
    }

    /* ================= 内容区 ================= */
    #main {
        flex: 1 1 auto;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
        padding: 12px 12px 90px;
    }
    .view { display: none; }
    .view.active { display: block; }

    /* ---------- 区域卡片（展品检索） ---------- */
    .zone-card {
        border: 1px solid var(--line);
        border-radius: 12px;
        background: linear-gradient(180deg, rgba(212,175,55,0.07), rgba(212,175,55,0.02));
        margin-bottom: 12px;
        overflow: hidden;
    }
    .zone-head {
        display: flex; align-items: center; gap: 10px;
        padding: 13px 14px;
        cursor: pointer;
        user-select: none;
    }
    .zone-thumb {
        flex: 0 0 auto;
        width: 44px; height: 44px;
        border-radius: 8px;
        border: 1px solid var(--line);
        background: #2a2218 center/cover no-repeat;
        display: flex; justify-content: center; align-items: center;
        font-size: 1.05rem; color: rgba(212,175,55,0.5);
        overflow: hidden;
    }
    .zone-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .zone-name {
        flex: 1;
        font-size: 0.95rem; font-weight: bold; color: var(--sand);
        line-height: 1.3;
        min-width: 0;
    }
    .zone-name .en {
        display: block;
        font-size: 0.62rem;
        font-weight: normal;
        color: rgba(244,234,225,0.4);
        letter-spacing: 1px;
        margin-top: 2px;
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .zone-count {
        flex: 0 0 auto;
        font-size: 0.7rem; color: var(--gold);
        border: 1px solid var(--line);
        border-radius: 10px; padding: 2px 7px;
        margin-right: 4px;
    }
    .zone-arrow {
        flex: 0 0 auto;
        color: var(--gold); font-size: 0.75rem;
        transition: transform 0.25s;
    }
    .zone-card.open .zone-arrow { transform: rotate(90deg); }

    .zone-play {
        flex: 0 0 auto;
        background: transparent;
        border: 1px solid var(--gold);
        color: var(--gold);
        border-radius: 14px;
        font-size: 0.7rem;
        padding: 4px 10px;
        cursor: pointer;
        font-family: inherit;
        white-space: nowrap;
    }
    .zone-play:active { background: rgba(212,175,55,0.18); }

    .zone-items {
        display: none;
        border-top: 1px solid var(--line);
        background: rgba(0,0,0,0.25);
    }
    .zone-card.open .zone-items { display: block; }

    .item-row {
        display: flex; align-items: center; gap: 10px;
        padding: 11px 14px;
        border-bottom: 1px solid rgba(212,175,55,0.1);
        cursor: pointer;
    }
    .item-row:last-child { border-bottom: none; }
    .item-row:active { background: rgba(212,175,55,0.1); }
    .item-no {
        flex: 0 0 auto;
        width: 30px;
        font-size: 0.72rem; color: var(--gold); font-weight: bold;
        text-align: center;
    }
    .item-thumb {
        flex: 0 0 auto;
        width: 42px; height: 42px;
        border-radius: 6px;
        border: 1px solid var(--line);
        background: #2a2218 center/cover no-repeat;
        display: flex; justify-content: center; align-items: center;
        font-size: 1rem; color: rgba(212,175,55,0.5);
        overflow: hidden;
    }
    .item-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .item-text { flex: 1; min-width: 0; }
    .item-name {
        font-size: 0.86rem; color: var(--sand);
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .item-sub {
        font-size: 0.7rem; color: rgba(244,234,225,0.45);
        margin-top: 2px;
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .item-audio {
        flex: 0 0 auto;
        width: 26px; height: 26px; border-radius: 50%;
        border: 1px solid var(--gold);
        display: flex; justify-content: center; align-items: center;
        font-size: 0.7rem; color: var(--gold);
    }


    /* ---------- 图片放大层（展品大图共用） ---------- */
    #map-zoom {
        position: fixed; inset: 0;
        background: rgba(0,0,0,0.94);
        z-index: 9700;
        display: flex; justify-content: center; align-items: center;
        opacity: 0; visibility: hidden;
        transition: opacity 0.25s, visibility 0.25s;
    }
    #map-zoom.show { opacity: 1; visibility: visible; }
    #map-zoom img {
        max-width: 100vw;
        max-height: 100vh;
        object-fit: contain;
    }
    #map-zoom .zoom-close {
        position: absolute; top: 14px; right: 14px;
        width: 36px; height: 36px; border-radius: 50%;
        border: 1px solid var(--gold); background: rgba(0,0,0,0.6);
        color: var(--gold); font-size: 18px; line-height: 1;
        display: flex; justify-content: center; align-items: center;
        cursor: pointer;
    }

    /* ================= 讲解弹层（区域 / 展品共用） ================= */
    #detail-modal {
        position: fixed; inset: 0;
        background: rgba(0,0,0,0.9);
        z-index: 9000;
        display: flex; justify-content: center; align-items: center;
        opacity: 0; visibility: hidden;
        transition: opacity 0.25s, visibility 0.25s;
        padding: 16px;
    }
    #detail-modal.show { opacity: 1; visibility: visible; }

    .detail-card {
        width: 100%;
        max-width: 460px;
        max-height: 88vh;
        background: var(--dark2);
        border: 1px solid var(--gold);
        border-radius: 14px;
        display: flex; flex-direction: column;
        overflow: hidden;
        transform: scale(0.94);
        transition: transform 0.25s;
        box-shadow: 0 0 50px rgba(212,175,55,0.35);
    }
    #detail-modal.show .detail-card { transform: scale(1); }

    .detail-head {
        flex: 0 0 auto;
        display: flex; align-items: center; gap: 10px;
        padding: 12px 14px;
        border-bottom: 1px solid var(--line);
        background: rgba(0,0,0,0.35);
    }
    .detail-badge {
        flex: 0 0 auto;
        font-size: 0.66rem;
        color: var(--gold);
        border: 1px solid var(--gold);
        border-radius: 10px;
        padding: 2px 8px;
    }
    .detail-title {
        flex: 1;
        font-size: 0.95rem; font-weight: bold; color: var(--sand);
        line-height: 1.3;
    }
    .detail-close {
        flex: 0 0 auto;
        width: 28px; height: 28px;
        border-radius: 50%;
        border: 1px solid var(--gold);
        background: transparent;
        color: var(--gold);
        font-size: 16px; line-height: 1;
        cursor: pointer;
        display: flex; justify-content: center; align-items: center;
    }

    .detail-body {
        flex: 1 1 auto;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
    }
    .detail-photo {
        width: 100%;
        aspect-ratio: 4 / 3;
        background: #0e0b07;
        display: flex; justify-content: center; align-items: center;
        overflow: hidden;
        border-bottom: 1px solid var(--line);
        position: relative;
    }
    .detail-photo img {
        width: 100%; height: 100%; object-fit: cover; display: block;
        cursor: zoom-in;
    }
    .photo-placeholder {
        position: absolute; inset: 0;
        display: flex; flex-direction: column;
        justify-content: center; align-items: center; gap: 6px;
        color: rgba(212,175,55,0.55);
        font-size: 0.78rem;
        background:
            repeating-linear-gradient(45deg, rgba(212,175,55,0.05) 0 14px, transparent 14px 28px);
        text-align: center;
        padding: 0 20px;
    }
    .photo-placeholder .big { font-size: 2.2rem; }

    .detail-desc {
        padding: 13px 15px;
        font-size: 0.84rem;
        line-height: 1.65;
        color: rgba(244,234,225,0.8);
        border-bottom: 1px solid var(--line);
    }

    /* 朗读按钮条（位于图片下方、讲解文字上方） */
    .tts-bar {
        padding: 12px 15px;
        display: flex;
        background: rgba(212,175,55,0.06);
        border-bottom: 1px solid var(--line);
    }
    .tts-btn {
        flex: 1;
        height: 42px;
        border-radius: 21px;
        background: var(--gold);
        border: none;
        color: var(--dark);
        font-size: 0.88rem;
        font-weight: bold;
        letter-spacing: 1px;
        cursor: pointer;
        display: flex; justify-content: center; align-items: center; gap: 6px;
        font-family: inherit;
    }
    .tts-btn.tts-on { background: #8a6d1f; color: var(--sand); }

    /* ================= AI 悬浮球 ================= */
    #ai-fab {
        position: fixed;
        right: 16px; bottom: 20px;
        width: 54px; height: 54px;
        border-radius: 50%;
        background: radial-gradient(circle at 30% 30%, #f0d67a, var(--gold) 65%);
        border: 2px solid #fff;
        box-shadow: 0 4px 20px rgba(212,175,55,0.55);
        display: flex; flex-direction: column;
        justify-content: center; align-items: center;
        cursor: pointer;
        z-index: 9500;
        color: var(--dark);
        transition: transform 0.2s;
    }
    #ai-fab:active { transform: scale(0.92); }
    #ai-fab .ico { font-size: 1.35rem; line-height: 1; }
    #ai-fab .txt { font-size: 0.55rem; font-weight: bold; letter-spacing: 1px; margin-top: 1px; }

    #ai-panel {
        position: fixed;
        right: 12px; bottom: 12px;
        width: calc(100% - 24px);
        max-width: 400px;
        height: min(70vh, 520px);
        background: var(--dark2);
        border: 1px solid var(--gold);
        border-radius: 14px;
        box-shadow: 0 10px 50px rgba(0,0,0,0.75);
        z-index: 9600;
        display: flex; flex-direction: column;
        overflow: hidden;
        transform: translateY(16px) scale(0.96);
        opacity: 0; visibility: hidden;
        transition: all 0.25s ease;
    }
    #ai-panel.show { transform: none; opacity: 1; visibility: visible; }

    .ai-head {
        flex: 0 0 auto;
        display: flex; align-items: center; justify-content: space-between;
        padding: 11px 14px;
        background: rgba(0,0,0,0.4);
        border-bottom: 1px solid var(--line);
        font-size: 0.9rem; font-weight: bold; color: var(--gold);
    }
    .ai-head .close {
        width: 26px; height: 26px; border-radius: 50%;
        border: 1px solid var(--gold); background: transparent;
        color: var(--gold); font-size: 15px; line-height: 1;
        cursor: pointer;
        display: flex; justify-content: center; align-items: center;
    }
    .ai-context {
        flex: 0 0 auto;
        font-size: 0.68rem;
        color: rgba(244,234,225,0.5);
        padding: 6px 14px;
        border-bottom: 1px solid rgba(212,175,55,0.12);
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .ai-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 12px 14px;
        font-size: 0.85rem;
        line-height: 1.6;
        color: #ddd;
        -webkit-overflow-scrolling: touch;
    }
    .ai-body .msg { margin-bottom: 10px; }
    .ai-body .msg.user { text-align: right; }
    .ai-body .msg.user span {
        display: inline-block;
        background: rgba(212,175,55,0.18);
        border: 1px solid var(--line);
        border-radius: 10px 10px 2px 10px;
        padding: 7px 11px;
        max-width: 85%;
        color: var(--sand);
        text-align: left;
    }
    .ai-body .msg.ai span {
        display: inline-block;
        background: rgba(0,0,0,0.4);
        border: 1px solid rgba(212,175,55,0.18);
        border-radius: 10px 10px 10px 2px;
        padding: 7px 11px;
        max-width: 92%;
    }
    .ai-input-wrap {
        flex: 0 0 auto;
        display: flex; gap: 8px;
        padding: 10px 12px;
        border-top: 1px solid var(--line);
        background: rgba(0,0,0,0.3);
    }
    .ai-input-wrap input {
        flex: 1;
        background: #2b231a;
        border: 1px solid var(--gold);
        border-radius: 20px;
        padding: 8px 14px;
        color: #fff; outline: none;
        font-size: 0.85rem;
        font-family: inherit;
    }
    .ai-input-wrap button {
        flex: 0 0 auto;
        background: var(--gold); border: none;
        color: var(--dark);
        border-radius: 20px;
        padding: 8px 18px;
        font-weight: bold; font-size: 0.85rem;
        cursor: pointer;
        font-family: inherit;
    }
    .ai-input-wrap button:disabled { background: #555; color: #888; }

</style>
</head>
<body>

<header>
    <div class="title">🏛️ 大埃及博物馆·智能语音导览</div>
    <div class="sub">GRAND EGYPTIAN MUSEUM · AUDIO GUIDE</div>
</header>

<div id="main">

    <!-- ============ 展品检索（默认视图） ============ -->
    <div class="view active" id="view-list"></div>

</div>

<!-- ================= 图片放大查看 ================= -->
<div id="map-zoom" onclick="if(event.target===this) closeMapZoom()">
    <button class="zoom-close" onclick="closeMapZoom()">&times;</button>
    <img id="map-zoom-img" src="" alt="图片放大">
</div>

<!-- ================= 讲解弹层（区域 / 展品共用） ================= -->
<div id="detail-modal" onclick="if(event.target===this) closeDetail()">
    <div class="detail-card">
        <div class="detail-head">
            <span class="detail-badge" id="detail-badge">区域</span>
            <div class="detail-title" id="detail-title">标题</div>
            <button class="detail-close" onclick="closeDetail()">&times;</button>
        </div>
        <div class="detail-body">
            <div class="detail-photo">
                <img id="detail-img" src="" alt="" style="display:none" onclick="openMapZoom(this.src)">
                <div class="photo-placeholder" id="detail-photo-ph">
                    <div class="big">🖼️</div>
                    <div id="detail-photo-ph-text">图片占位</div>
                </div>
            </div>
            <div class="tts-bar">
                <button class="tts-btn" id="tts-btn" onclick="toggleTTS()">🔊 语音讲解</button>
            </div>
            <div class="detail-desc" id="detail-desc">描述占位</div>
        </div>
    </div>
</div>

<!-- ================= AI 悬浮球 ================= -->
<div id="ai-fab" onclick="toggleAiPanel()">
    <div class="ico">🔮</div>
    <div class="txt">法老密室</div>
</div>

<!-- ================= AI 对话面板 ================= -->
<div id="ai-panel">
    <div class="ai-head">
        <span>🔮 法老密室</span>
        <button class="close" onclick="toggleAiPanel(false)">&times;</button>
    </div>
    <div class="ai-context" id="ai-context">当前浏览：导览首页</div>
    <div class="ai-body" id="ai-body">
        <div class="msg ai"><span>游客，点击任意区域或展品即可聆听讲解。若有历史疑问，尽管在此向我发问……</span></div>
    </div>
    <div class="ai-input-wrap">
        <input type="text" id="user-question" placeholder="向拉美西斯二世提问..."
               onkeypress="handleKeyPress(event)">
        <button onclick="askPharaoh()" id="ask-btn">提问</button>
    </div>
</div>

<script>
/* =========================================================
   一、数据配置区（与 gem-guide-data.js 同源的正式数据）
   ========================================================= */
const DATA = {
/* ---------------- 6 个区域 ---------------- */
zones: [
  {
    id: 'z1',
    name: '走进大埃及博物馆',
    nameEn: 'Arrival',
    zoneImg: 'images/shared/zone1.jpg',
    audio: 'audio/zh/zone1.mp3',
    desc: '欢迎来到大埃及博物馆。2025 年 11 月，这座建了二十多年的博物馆正式开馆，就坐落在吉萨金字塔旁——透过馆内巨大的玻璃幕墙，能直接望见三座金字塔，所以它也被称为连接古代与现代的"第四座金字塔"。它是全世界最大的单一文明博物馆，占地约 50 万平方米，馆藏超过 10 万件文物，从史前时代一直讲到希腊罗马时期。馆内 12 个主题展厅按时间与主题双线布展；图坦卡蒙的五千多件随葬品在这里第一次完整集中展出；大厅里立着高 11 米、重 83 吨的拉美西斯二世巨像；大阶梯上有 59 尊雕像，每一尊都有自己的故事。两个提醒：相机请关掉闪光灯；手别碰展柜玻璃——三千五百年的东西，经不起现代人的热情。'
  },
  {
    id: 'z2',
    name: '大厅',
    nameEn: 'Grand Hall',
    zoneImg: 'images/shared/zone2.jpg',
    audio: 'audio/zh/zone2.mp3',
    desc: '这里叫"大厅"。抬头看这些花岗岩大家伙——它们不是装饰，是政治语言。在古埃及，法老不只是人，他是神在人间的代理人，是秩序的化身。怎么让一整个国家相信这件事？最直接的办法，就是把国王做成十米高的石头。你一抬头、脖子发酸的那一刻，权力就完成了它的工作。大厅其实是一场精心安排的"下马威"：还没看到任何小文物，你先被体量说服了。古埃及人管这个叫"永恒"。主要三组重器：梅伦普塔的胜利柱，还有两尊从海底城市打捞上来的托勒密巨像，一王一后。'
  },
  {
    id: 'z3',
    name: '大阶梯',
    nameEn: 'Grand Staircase',
    zoneImg: 'images/shared/zone3.jpg',
    audio: 'audio/zh/zone3.mp3',
    desc: '这段路是我最喜欢的部分。大阶梯不只是一段楼梯，它是一条时间轴。你从下往上走，就是从四千多年前走到两千多年前；走到顶，正对着吉萨那三座真金字塔——建筑的终点，也是时间的终点。阶梯两侧摆的，都是各朝各代的"国家形象工程"：图特摩斯三世的坐像、哈特谢普苏特的巨像与方尖碑顶端、阿肯那顿那张"不像法老"的脸……每一件都曾站在某座神庙门口，替一位国王向天下宣告"我是谁"。建议你走得慢一点。等上到顶回头一望，会突然明白设计师的用意——他在用石头写一句话：看，我们从来没断过。'
  },
  {
    id: 'z4',
    name: '图坦卡蒙展厅',
    nameEn: 'Tutankhamun Galleries',
    zoneImg: 'images/shared/zone4.png',
    audio: 'audio/zh/zone4.mp3',
    desc: '这片灯光压得很暗的区域，是全馆人最多的地方 —— 因为这里躺着图坦卡蒙。\n先说说他是谁。他是新王国第十八王朝的法老，九岁登基、十九岁去世，在位时间短，政绩也不算突出，本不该在历史上留下太多痕迹。但他偏偏成了古埃及最出名的法老 —— 不是因为他活得多精彩，而是因为他死后 "睡得太完整"。\n1922 年 11 月，英国人霍华德・卡特在卢克索国王谷挖到一段向下的台阶。他举着蜡烛往里看，身后的人急着问："你看见什么了？" 他沉默了很久，才说出那句传了一百年的话："是的，好东西。" 那一句，打开的是考古史上最完整的一座王陵：五千三百九十八件文物，一件不少，全是给一个十九岁就死去的少年准备的。\n灯这么暗是有道理的。这些金子、宝石、陪葬品，本来就不是给人看的 —— 它们是给死者用的，要在漆黑的墓里陪他走过十二道门，直到天亮。\n看的时候请小声一点。不是规矩，是礼貌。'
  },
  {
    id: 'z5',
    name: '主展厅',
    nameEn: 'Main Galleries',

/* 区域视图映射（HTML 端沿用 en 字段名） */
const ZONES = DATA.zones.map(z => ({
    id: z.id, name: z.name, en: z.nameEn,
    zoneImg: z.zoneImg, audio: z.audio, desc: z.desc
}));
const ITEMS = DATA.items;

/* =========================================================
   二、渲染逻辑
   ========================================================= */

const viewList = document.getElementById('view-list');

let currentContext = '导览首页';
let currentDetail  = null;

/* ---- 渲染区域列表 ---- */
function renderList() {
    viewList.innerHTML = ZONES.map((z, zi) => {
        const items = ITEMS.filter(it => it.zone === z.id);

        const rows = items.map(it => `
            <div class="item-row" onclick="openItem(${it.no})">
                <div class="item-no">${it.no}</div>
                <div class="item-thumb" data-thumb="${it.img}">🖼</div>
                <div class="item-text">
                    <div class="item-name">${it.name}</div>
                    <div class="item-sub">${it.sub}</div>
                </div>
                <div class="item-audio">🔊</div>
            </div>
        `).join('');

        return `
        <div class="zone-card" id="zc-${z.id}">
            <div class="zone-head" onclick="toggleZone('${z.id}')">
                <div class="zone-thumb" data-thumb="${z.zoneImg}">🏛</div>
                <div class="zone-name">
                    ${z.name}
                    <span class="en">${z.en}</span>
                </div>
                <div class="zone-count">${items.length} 件</div>
                <button class="zone-play" onclick="event.stopPropagation(); openZone('${z.id}')">▶ 区域讲解</button>
                <div class="zone-arrow">▶</div>
            </div>
            <div class="zone-items">${rows}</div>
        </div>`;
    }).join('');

    document.querySelectorAll('[data-thumb]').forEach(box => {
        const src = box.dataset.thumb;
        if (!src) return;
        const img = new Image();
        img.onload = () => { box.innerHTML = `<img src="${src}" alt="">`; };
        img.src = src;
    });
}

/* ---- 视图（仅保留展品列表视图） ---- */

/* ---- 区域展开 / 收起（手风琴） ---- */
function toggleZone(id) {
    const card = document.getElementById('zc-' + id);
    if (!card) return;
    const willOpen = !card.classList.contains('open');
    document.querySelectorAll('.zone-card').forEach(c => c.classList.remove('open'));
    if (willOpen) card.classList.add('open');
}

/* ---- 打开区域讲解 ---- */
function openZone(id) {
    const z = ZONES.find(x => x.id === id);
    if (!z) return;
    currentDetail = { type: 'zone', data: z };
    currentContext = `区域：${z.name}`;
    updateAiContext();
    stopSpeech();

    document.getElementById('detail-badge').innerText = '区域讲解';
    document.getElementById('detail-title').innerText = z.name;
    document.getElementById('detail-desc').innerText = z.desc;
    setDetailPhoto(z.zoneImg, z.name);
    showDetail();
}

/* ---- 打开展品讲解 ---- */
function openItem(no) {
    const it = ITEMS.find(x => x.no === Number(no));
    if (!it) return;
    const z = ZONES.find(x => x.id === it.zone);
    currentDetail = { type: 'item', data: it };
    currentContext = `展品 ${it.no}：${it.name}` + (z ? `（${z.name}）` : '');
    updateAiContext();
    stopSpeech();

    document.getElementById('detail-badge').innerText = '展品 ' + String(it.no).padStart(2, '0');
    document.getElementById('detail-title').innerText = it.name;
    document.getElementById('detail-desc').innerText = it.desc;
    setDetailPhoto(it.img, it.name);
    showDetail();
}

/* ---- 详情图片（有图显示，无图占位） ---- */
function setDetailPhoto(src, name) {
    const img = document.getElementById('detail-img');
    const ph  = document.getElementById('detail-photo-ph');
    const phT = document.getElementById('detail-photo-ph-text');
    img.style.display = 'none';
    ph.style.display = 'flex';
    img.onload = () => { img.style.display = 'block'; ph.style.display = 'none'; };
    img.onerror = () => {
        img.style.display = 'none';
        ph.style.display = 'flex';
        phT.innerText = '图片占位 · ' + (src || '未配置');
    };
    img.src = src || '';
    img.alt = name || '';
    if (!src) { phT.innerText = '图片占位 · 未配置路径'; }
}

function showDetail() {
    document.getElementById('detail-modal').classList.add('show');
    document.querySelector('.detail-body').scrollTop = 0;
}
function closeDetail() {
    document.getElementById('detail-modal').classList.remove('show');
    stopSpeech();
    currentDetail = null;
    currentContext = '导览首页';
    updateAiContext();
}

/* ---- 图片放大 ---- */
function openMapZoom(src) {
    if (!src) return;
    document.getElementById('map-zoom-img').src = src;
    document.getElementById('map-zoom').classList.add('show');
}
function closeMapZoom() {
    document.getElementById('map-zoom').classList.remove('show');
    setTimeout(() => {
        if (!document.getElementById('map-zoom').classList.contains('show')) {
            document.getElementById('map-zoom-img').src = '';
        }
    }, 300);
}


/* =========================================================
   三·五、系统语音朗读（Web Speech API，离线可用）
   ========================================================= */
let ttsBtnRef = null;

/* 预热：尽早取一次音色列表；iOS 需要首次交互后才可用 */
if ('speechSynthesis' in window) {
    speechSynthesis.getVoices();
    speechSynthesis.onvoiceschanged = () => speechSynthesis.getVoices();
}

function getZhVoice() {
    const vs = speechSynthesis.getVoices();
    return vs.find(v => v.lang.replace('_', '-').startsWith('zh') && v.localService)
        || vs.find(v => v.lang.replace('_', '-').startsWith('zh'));
}

function setTtsBtn(btn, on) {
    if (!btn) return;
    btn.innerText = on ? '⏹ 停止语音' : '🔊 语音讲解';
    btn.classList.toggle('tts-on', on);
}

function stopSpeech() {
    if ('speechSynthesis' in window) speechSynthesis.cancel();
    if (ttsBtnRef) { setTtsBtn(ttsBtnRef, false); ttsBtnRef = null; }
}

function speakText(text, btn) {
    if (!('speechSynthesis' in window)) {
        alert('当前浏览器不支持语音合成，请使用较新版本的浏览器。');
        return;
    }
    /* 再次点击同一按钮 = 停止 */
    if (speechSynthesis.speaking && !speechSynthesis.paused && btn === ttsBtnRef) {
        stopSpeech();
        return;
    }
    stopSpeech();

    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'zh-CN';
    u.rate = 0.95;
    const v = getZhVoice();
    if (v) u.voice = v;
    u.onend   = () => { setTtsBtn(btn, false); if (ttsBtnRef === btn) ttsBtnRef = null; };
    u.onerror = () => { setTtsBtn(btn, false); if (ttsBtnRef === btn) ttsBtnRef = null; };

    setTtsBtn(btn, true);
    ttsBtnRef = btn;
    speechSynthesis.speak(u);
}

/* 弹层里的朗读按钮：读当前区域/展品的 desc */
function toggleTTS() {
    if (!currentDetail) return;
    speakText(currentDetail.data.desc, document.getElementById('tts-btn'));
}


/* =========================================================
   四、AI 悬浮面板
   ========================================================= */
let eventSource = null;
let aiBusy = false;

function toggleAiPanel(force) {
    const panel = document.getElementById('ai-panel');
    const show = typeof force === 'boolean' ? force : !panel.classList.contains('show');
    panel.classList.toggle('show', show);
    if (show) setTimeout(() => document.getElementById('user-question').focus(), 260);
}

function updateAiContext() {
    document.getElementById('ai-context').innerText = '当前浏览：' + currentContext;
}

function handleKeyPress(e) {
    if (e.key === 'Enter') askPharaoh();
}

function appendMsg(role, text) {
    const body = document.getElementById('ai-body');
    const div = document.createElement('div');
    div.className = 'msg ' + role;
    div.innerHTML = '<span>' + text + '</span>';
    body.appendChild(div);
    body.scrollTop = body.scrollHeight;
    return div.querySelector('span');
}

function askPharaoh() {
    if (aiBusy) return;
    const input = document.getElementById('user-question');
    const btn   = document.getElementById('ask-btn');
    const question = input.value.trim();
    if (!question) return;

    if (eventSource) { eventSource.close(); eventSource = null; }

    input.value = '';
    input.disabled = true;
    btn.disabled = true;
    aiBusy = true;

    appendMsg('user', question);
    const aiSpan = appendMsg('ai', '⏳ 法老正拨开三千年的风沙，在泥板上翻阅史料...');

    let fullAnswer = '';
    const ctx = currentContext !== '导览首页' ? `当前游客在：${currentContext}。问题是：` : '';
    const url = `/api/chat?question=${encodeURIComponent(ctx + question)}`;
    eventSource = new EventSource(url);

    eventSource.addEventListener('conversation.message.delta', function (e) {
        try {
            const obj = JSON.parse(e.data);
            if (obj.type === 'answer') {
                const chunk = obj.content || obj.reasoning_content || '';
                if (chunk) {
                    fullAnswer += chunk;
                    aiSpan.innerHTML = fullAnswer;
                    const body = document.getElementById('ai-body');
                    body.scrollTop = body.scrollHeight;
                }
            }
        } catch (err) { /* 忽略解析失败的分片 */ }
    });

    eventSource.addEventListener('conversation.chat.completed', safeClose);
    eventSource.addEventListener('conversation.chat.failed', function () {
        aiSpan.innerHTML = '神殿算力已耗尽，请稍后再向我发问。';
        safeClose();
    });
    eventSource.onerror = function () {
        aiSpan.innerHTML = '法老正在神殿沉睡，恢复网络后再来打扰吧。';
        safeClose();
    };

    function safeClose() {
        if (eventSource) { eventSource.close(); eventSource = null; }
        input.disabled = false;
        btn.disabled = false;
        aiBusy = false;
    }
}


/* =========================================================
   五、初始化
   ========================================================= */
document.addEventListener('DOMContentLoaded', () => {
    renderList();
    updateAiContext();

    document.addEventListener('keydown', e => {
        if (e.key === 'Escape') {
            if (document.getElementById('map-zoom').classList.contains('show')) closeMapZoom();
            else if (document.getElementById('detail-modal').classList.contains('show')) closeDetail();
            else toggleAiPanel(false);
        }
    });

    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('/sw.js')
                .then(() => console.log('离线导览系统准备就绪！'))
                .catch(err => console.log('离线注册失败:', err));
        });
    }
});
</script>
